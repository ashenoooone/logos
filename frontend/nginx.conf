server {
    listen 80;
    root /usr/share/nginx/html;
    # Ответ с файлом до 20 MiB + запас на заголовки.
    client_max_body_size 25m;

    # API-префиксы, не совпадающие с SPA-маршрутами.
    location ~ ^/(health|auth|admin|invitations|account|conversations|messages|tags) {
        proxy_pass http://backend:8000;
        # Host с портом нужен для same-origin CSRF-проверки бэкенда.
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri /index.html;
    }
}
