[project]
name = "logos-backend"
version = "0.1.0"
description = "Backend service for Logos"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "fastapi>=0.116",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.35",
]

[project.scripts]
logos-backend = "logos_backend.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logos_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
files = ["src", "tests"]
